name: CI

on:
  push:
    branches: [master, "v*.*.*"]
  pull_request:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message matches version.rb
        run: |
          set -euo pipefail
          VERSION=$(ruby -e "load 'lib/docscribe/version.rb'; puts Docscribe::VERSION")
          echo "version.rb: $VERSION"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            RANGE="$BASE..$HEAD"
          else
            RANGE="HEAD"
          fi
          echo "Range: $RANGE"
          FAIL=0
          for SHA in $(git rev-list "$RANGE" 2>/dev/null || echo "HEAD"); do
            SUBJECT=$(git show -s --pretty=%s "$SHA")
            echo "Checking $SHA: $SUBJECT"
            if ! echo "$SUBJECT" | grep -Eq "^\[$VERSION\] "; then
              echo "::error::Commit $SHA subject does not match [$VERSION] — got: $SUBJECT"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "Expected commit subject to start with [$VERSION] (from lib/docscribe/version.rb)"
            exit 1
          fi
          echo "All checked commits match [$VERSION]"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 2.7, 3.0, 3.1, 3.2, 3.3, 3.4, 4.0 ]
    env:
      BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
      BUNDLE_WITHOUT: ${{ contains(fromJson('["3.0", "3.1"]'), matrix.ruby) && 'rbs' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Docscribe (check docs are up-to-date)
        env:
          BUNDLE_GEMFILE: 'Gemfile'
        run: |
          cd test_project
          bundle install
          FILES="$(cd .. && git ls-files 'lib/**/*.rb' | sed 's|^|../|')"
          bundle exec docscribe $FILES -C ../docscribe.yml

      - name: Docscribe (aggressive mode smoke test)
        env:
          BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
        run: |
          bundle exec docscribe lib -AkB --verbose

      - name: Steep (type check)
        if: ${{ !contains(fromJson('["2.7", "3.0", "3.1"]'), matrix.ruby) }}
        run: bundle exec steep check

      - name: RuboCop (self‑check)
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec
