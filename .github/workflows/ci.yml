name: CI

on:
  push:
    branches: [master, "v*.*.*"]
  pull_request:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message matches version.rb
        run: |
          VERSION=$(ruby -e "load 'lib/docscribe/version.rb'; puts Docscribe::VERSION")
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SUBJECT=$(git show -s --pretty=%s "${{ github.event.pull_request.head.sha }}")
            echo "version.rb: $VERSION"
            echo "commit: $SUBJECT"
            if ! echo "$SUBJECT" | grep -Eq "^\[$VERSION\] "; then
              echo "::error::Commit subject does not match [$VERSION] — got: $SUBJECT"
              exit 1
            fi
            exit 0
          fi
          SUBJECT=$(git log -1 --pretty=%s)
          echo "version.rb: $VERSION"
          echo "commit: $SUBJECT"
          # Merge commits (release flow v*.*.* -> master, system/* -> master)
          # carry GitHub's default "Merge pull request #N from ..." subject.
          # Validate the merged commits instead of the merge subject itself.
          if echo "$SUBJECT" | grep -Eq "^Merge "; then
            # system/* merges follow conventional commits, version check N/A
            if echo "$SUBJECT" | grep -Eq "from .*/system/"; then
              echo "System merge, skipping version check"
              exit 0
            fi
            if git rev-parse --verify HEAD^2 >/dev/null 2>&1; then
              FAIL=0
              for SHA in $(git rev-list HEAD^1..HEAD^2); do
                S=$(git show -s --pretty=%s "$SHA")
                echo "Checking $SHA: $S"
                if ! echo "$S" | grep -Eq "^\[$VERSION\] "; then
                  echo "::error::Commit $SHA subject does not match [$VERSION] — got: $S"
                  FAIL=1
                fi
              done
              exit $FAIL
            else
              echo "Merge commit without second parent, skipping version check"
              exit 0
            fi
          fi
          if ! echo "$SUBJECT" | grep -Eq "^\[$VERSION\] "; then
            echo "::error::Commit subject does not match [$VERSION] — got: $SUBJECT"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 2.7, 3.0, 3.1, 3.2, 3.3, 3.4, 4.0 ]
    env:
      BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
      BUNDLE_WITHOUT: ${{ contains(fromJson('["3.0", "3.1"]'), matrix.ruby) && 'rbs' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Docscribe (check docs are up-to-date)
        # RBS is unavailable on these rubies, so fallback inference can never
        # match the RBS-precise docs — same reason Steep is skipped below.
        # NOTE: the check itself must run from the repo root: docscribe.yml
        # relative paths (sig_dirs, rbs_collection.lock.yaml) resolve against
        # the working directory, and test_project/ has no sig/.
        if: ${{ !contains(fromJson('["2.7", "3.0", "3.1"]'), matrix.ruby) }}
        run: |
          cd test_project && BUNDLE_GEMFILE=Gemfile bundle install && cd ..
          # .gem_rbs_collection/ is gitignored, so a fresh checkout has no
          # collection and RBS lookups silently fall back to inference
          # (dozens of false mismatches). Materialize it from the lock file.
          bundle exec rbs collection install
          FILES="$(git ls-files 'lib/**/*.rb')"
          bundle exec docscribe $FILES -C docscribe.yml

      - name: Docscribe (aggressive mode smoke test)
        env:
          BUNDLE_GEMFILE: ${{ matrix.ruby == '2.7' && 'Gemfile_2_7' || 'Gemfile' }}
        run: |
          bundle exec docscribe lib -AkB --verbose

      - name: Steep (type check)
        if: ${{ !contains(fromJson('["2.7", "3.0", "3.1"]'), matrix.ruby) }}
        run: bundle exec steep check

      - name: RuboCop (self‑check)
        run: bundle exec rubocop

      - name: RSpec
        run: bundle exec rspec

  # Windows has no Process.fork, so this job is the only place the
  # fork-less paths in --parallel and server mode are exercised for real
  # rather than through a stubbed Process.respond_to?(:fork).
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ 3.2, 3.3, 3.4 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Confirm fork is really unavailable
        shell: ruby {0}
        run: |
          unless Process.respond_to?(:fork)
            puts "Process.fork unavailable, as expected on Windows"
            exit 0
          end
          abort "Process.fork is available here, so this job no longer tests the fork-less path"

      - name: Docscribe (--parallel falls back to sequential)
        # Files are generated by Ruby so the job does not depend on how the
        # Windows shell encodes written text (BOM, CRLF).
        shell: ruby {0}
        run: |
          require 'fileutils'
          FileUtils.mkdir_p('tmp/win')
          (1..2).each do |i|
            File.write("tmp/win/sample#{i}.rb", <<~RUBY_SAMPLE)
              # frozen_string_literal: true

              # Sample method.
              #
              # @param x [Integer] value
              # @return [Integer]
              def sample#{i}(x)
                x + 1
              end
            RUBY_SAMPLE
          end
          # Two files means a real slice split would happen if fork worked.
          ok = system('bundle', 'exec', 'docscribe', 'tmp/win', '--parallel', '--jobs', '4')
          abort 'docscribe --parallel exited non-zero without fork' unless ok

          changed = Dir['tmp/win/*.rb'].reject { |f| File.read(f).include?('Sample method.') }
          abort "parallel run rewrote clean files: #{changed.join(', ')}" unless changed.empty?

      - name: RSpec (fork-less paths)
        run: bundle exec rspec spec/docscribe/cli/run_parallel_spec.rb spec/docscribe/cli/run_spec.rb spec/docscribe/types spec/docscribe/infer
